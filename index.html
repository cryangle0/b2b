<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TAOWO Order</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%23111' width='64' height='64'/><text x='8' y='44' fill='white' font-size='28' font-family='Helvetica'>T</text></svg>" />
  <style>
    :root {
      --ink: #111111;
      --mute: #707072;
      --mist: #f5f5f5;
      --line: #e5e5e5;
      --paper: #ffffff;
      --danger: #ba0c2f;
      --nav: 60px;
      --proto: 0px;
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    #root { min-height: 100%; }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
    }
    html.lock, body.lock { overflow: hidden; height: 100%; overscroll-behavior: none; }
    #root:has(.login) { height: 100%; overflow: hidden; }
    #root:empty {
      display: grid; place-items: center;
      letter-spacing: .2em; font-family: Helvetica, Arial, sans-serif;
    }
    #root:empty::before { content: "TAOWO"; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p { margin: 0; }
    ::selection { background: #111; color: #fff; }

    .proto {
      display: none;
    }

    .chrome {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: #fff;
      isolation: isolate;
    }
    .top {
      height: var(--nav);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 36px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .logo {
      font-weight: 700;
      letter-spacing: 0.22em;
      font-size: 15px;
      justify-self: start;
    }
    .logo span { letter-spacing: 0.08em; font-weight: 400; color: var(--mute); margin-left: 8px; font-size: 12px; }
    .nav {
      display: flex;
      gap: 28px;
      font-size: 16px;
      align-items: center;
    }
    .nav a { position: relative; padding: 8px 0; }
    .nav a.active:after,
    .nav a:hover:after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: #111;
    }
    .nav-drop { position: relative; }
    .nav-drop > a { display: inline-block; }
    .nav-drop .drop {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 140px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 8px 0;
      z-index: 40;
    }
    .nav-drop .drop a {
      display: block;
      padding: 8px 16px;
      white-space: nowrap;
    }
    .nav-drop .drop a:after { display: none; }
    .nav-drop:hover .drop, .nav-drop:focus-within .drop { display: block; }
    .who {
      display: flex; align-items: center; gap: 6px;
      border: 0; background: none; font-size: 14px; color: #111;
    }
    .tools {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .iconbtn {
      width: 40px; height: 40px;
      border: 0; background: transparent;
      display: grid; place-items: center;
      position: relative;
    }
    .badge {
      position: absolute; top: 6px; right: 4px;
      min-width: 16px; height: 16px; padding: 0 4px;
      background: #111; color: #fff; border-radius: 99px;
      font-size: 10px; line-height: 16px;
    }
    .searchbox {
      width: min(420px, 42vw);
      height: 40px;
      background: var(--mist);
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
    }
    .searchbox input {
      border: 0; background: transparent; outline: none; width: 100%;
      font-size: 14px;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 48px; padding: 0 28px;
      border-radius: 30px; border: 1.5px solid #111;
      background: #111; color: #fff;
      font-size: 15px; font-weight: 500;
      transition: transform .15s ease, background .15s ease, color .15s ease;
    }
    .btn:hover { transform: scale(1.015); }
    .btn.ghost { background: #fff; color: #111; }
    .btn.ghost:hover { background: #111; color: #fff; }
    .btn.block { width: 100%; }
    .btn.sm { height: 40px; padding: 0 18px; font-size: 14px; }
    .btn.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
    .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    label.btn { cursor: pointer; position: relative; overflow: hidden; }

    .page { padding-top: var(--nav); min-height: 100%; }
    .mall-shell.has-notice .page { padding-top: calc(var(--nav) + 36px); }
    .wrap { width: min(1440px, calc(100% - 72px)); margin: 0 auto; }
    .hero {
      height: min(62vh, 620px);
      position: relative;
      overflow: hidden;
      background: #111;
      color: #fff;
      width: 100%;
    }
    .hero img { width: 100%; height: 100%; object-fit: cover; opacity: .92; }
    .hero .copy {
      position: absolute; left: 64px; bottom: 72px;
      max-width: 560px;
    }
    .hero h1 { font-size: clamp(40px, 6vw, 72px); font-weight: 400; letter-spacing: -0.04em; line-height: .95; }
    .hero p { margin: 14px 0 28px; font-size: 18px; color: #ddd; }
    .hero-dots {
      position: absolute; right: 36px; bottom: 36px;
      display: flex; gap: 8px;
    }
    .hero-dots i {
      width: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.4); display: block;
    }
    .hero-dots i.on { background: #fff; width: 22px; }

    .section { padding: 56px 0 24px; }
    .section h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.03em; margin-bottom: 20px; }
    .cats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .cat {
      position: relative; min-height: 360px; overflow: hidden; background: #eee;
    }
    .cat img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .cat b {
      position: absolute; left: 24px; bottom: 24px;
      font-size: 22px; font-weight: 500; color: #fff;
      text-shadow: 0 1px 12px rgba(0,0,0,.35);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 12px;
    }
    .card { cursor: pointer; }
    .card .pic {
      background: var(--mist);
      aspect-ratio: 1 / 1.08;
      overflow: hidden;
      position: relative;
    }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card .meta { padding: 12px 0 8px; }
    .card .meta strong { display: block; font-weight: 500; font-size: 16px; }
    .card .meta em { font-style: normal; color: var(--mute); font-size: 14px; display: block; margin: 3px 0; }
    .card .meta b { font-weight: 500; }
    .tag {
      position: absolute; left: 10px; top: 10px;
      background: #fff; font-size: 12px; padding: 4px 8px;
    }
    .sold { color: var(--mute); }

    .shop-teams {
      display: flex; align-items: center; gap: 28px;
      padding: 18px 0 8px;
    }
    .shop-teams-copy { min-width: 88px; }
    .shop-teams-copy b { display: block; font-size: 16px; }
    .shop-teams-copy a { font-size: 13px; text-decoration: underline; color: var(--mute); }
    .shop-teams-row { display: flex; gap: 22px; overflow: auto; padding: 6px 0 10px; }
    .team-dot { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: #111; min-width: 64px; }
    .team-dot span {
      width: 56px; height: 56px; border-radius: 50%;
      display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 16px;
    }

    .plp {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 28px;
      padding: 20px 0 80px;
    }
    .plp-brand { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
    .plp-sel { margin-bottom: 16px; }
    .plp-sel h3, .plp-sort span, .plp-filter h3 { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
    .sel-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .sel-chips button {
      border: 1px solid #ccc; background: #fff; border-radius: 99px;
      height: 28px; padding: 0 10px; font-size: 12px;
    }
    .plp-sort { display: block; margin: 0 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .plp-sort select { width: 100%; border: 0; background: transparent; font-size: 14px; outline: none; }
    .plp-filter { border-bottom: 1px solid var(--line); padding: 10px 0; }
    .plp-filter summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
    .plp-filter summary::-webkit-details-marker { display: none; }
    .plp-filter summary:after { content: "▾"; color: var(--mute); }
    .plp-filter label {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; padding: 5px 0; color: #111;
    }
    .plp-filter input[type=checkbox] {
      appearance: none; width: 16px; height: 16px; border: 1px solid #888; border-radius: 50%;
      display: grid; place-items: center; margin: 0;
    }
    .plp-filter input[type=checkbox]:checked {
      border: 5px solid #111;
    }
    .plp-tools { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .plp-tools button { border: 0; background: none; text-align: left; text-decoration: underline; font-size: 13px; color: #111; padding: 0; }
    .plp-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .plp-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-bottom: 16px; min-height: 40px;
      background: #fff;
      position: relative;
      z-index: 2;
    }
    .plp { align-items: start; }
    .plp-toolbar .plp-search {
      flex: 1; min-width: 180px; height: 40px;
      border: 1px solid #ccc; border-radius: 4px; padding: 0 12px; font-size: 14px;
    }
    .plp-toolbar select {
      height: 40px; border: 1px solid #ccc; border-radius: 4px; padding: 0 10px; background: #fff;
    }
    .plp-countbox { border: 1px solid #ccc; height: 36px; padding: 0 12px; display: grid; place-items: center; font-size: 13px; border-radius: 4px; }
    .plp-range { color: var(--mute); font-size: 13px; }
    .plp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 16px;
    }
    .pcard { color: #111; }
    .pcard-pic {
      aspect-ratio: 1;
      overflow: hidden; position: relative;
      background: #e8e8e8;
    }
    .pcard-pic img, .pcard-pic .ph { width: 100%; height: 100%; object-fit: cover; }
    .pcard-heart {
      position: absolute; right: 8px; top: 8px;
      width: 34px; height: 34px; border: 0; border-radius: 50%;
      background: #fff; display: grid; place-items: center;
    }
    .pcard-heart.on { color: var(--danger); }
    .pcard-body { padding: 10px 0 4px; }
    .pcard-body strong { display: block; font-size: 14px; font-weight: 600; line-height: 1.35; min-height: 38px; }
    .pcard-price { display: block; font-size: 16px; font-weight: 700; margin: 6px 0 2px; }
    .pcard-meta { display: block; font-size: 12px; color: #555; line-height: 1.45; }
    .pcard-flag { display: block; font-size: 13px; color: var(--mute); }
    .swatches { display: flex; gap: 6px; margin: 8px 0 6px; }
    .swatches i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #ccc; display: block; }
    .swatches.lg i { width: 22px; height: 22px; }
    .swatches i.on { outline: 1px solid #111; outline-offset: 2px; }

    .crumb { font-size: 13px; color: var(--mute); padding: 16px 0 8px; }
    .crumb a { text-decoration: underline; }
    .pdp-page { padding-bottom: 80px; }
    .pdp {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 40px;
      min-height: calc(100vh - var(--nav) - 80px);
    }
    .pdp-media { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: start; }
    .pdp-media.stacked { grid-template-columns: 1fr; }
    .pdp-thumbs { display: flex; flex-direction: column; gap: 8px; }
    .pdp-thumbs.below { flex-direction: row; flex-wrap: wrap; }
    .pdp-thumbs button { border: 1px solid transparent; padding: 0; background: #e8e8e8; }
    .pdp-thumbs button.on { border-color: #111; }
    .pdp-thumbs img, .pdp-thumbs .ph { width: 72px; height: 72px; object-fit: cover; }
    .pdp-hero { background: #e8e8e8; min-height: 520px; }
    .pdp-hero img, .pdp-hero .ph { width: 100%; height: 100%; object-fit: cover; min-height: 520px; }
    .pdp-buy { padding: 8px 0 40px; position: sticky; top: calc(var(--nav) + 12px); height: fit-content; }
    .pdp-buy h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
    .stars { display: flex; align-items: center; gap: 6px; margin: 8px 0; color: #c4a000; font-size: 14px; }
    .stars b, .stars em { color: #111; font-style: normal; font-weight: 500; }
    .stockline { font-size: 14px; margin: 8px 0 12px; }
    .your-price { font-size: 22px; font-weight: 700; margin: 8px 0 4px; }
    .your-price span { font-size: 13px; font-weight: 500; color: var(--mute); margin-right: 8px; }
    .pdp-colors { margin: 16px 0 8px; }
    .pdp-colors span, .size-head span, .qty-row span { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    .size-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; }
    .nowrap { white-space: nowrap; }
    .linkish { border: 0; background: none; text-decoration: underline; font-size: 13px; white-space: nowrap; }
    .szchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
    .szchip {
      min-width: 56px; height: 40px; padding: 0 12px;
      border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 14px;
    }
    .szchip.on { background: #111; color: #fff; border-color: #111; }
    .szchip.off { color: #bbb; background: #f5f5f5; }
    .qty-row { display: block; margin-bottom: 16px; }
    .qty-row select { height: 40px; border: 1px solid #ccc; border-radius: 4px; padding: 0 10px; min-width: 88px; background: #fff; }
    .multi-size { margin: 0 0 16px; font-size: 14px; }
    .multi-size summary { cursor: pointer; margin-bottom: 10px; }
    .pdp-assures { margin-top: 12px; font-size: 13px; color: var(--mute); }
    .acc { margin-top: 28px; border-top: 1px solid var(--line); }
    .acc > button {
      width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
      background: #fff; padding: 14px 0; font-size: 16px; font-weight: 700;
    }
    .acc p, .acc ul { padding: 0 0 14px; font-size: 14px; line-height: 1.6; color: #444; }
    .pdp-buy .eyebrow { color: var(--mute); font-size: 14px; margin-bottom: 8px; }
    .price { font-size: 18px; margin: 14px 0 28px; }

    .split {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 48px;
      padding: 28px 0 80px;
    }
    .filters h3 { font-size: 16px; font-weight: 500; margin: 0; }
    .filters details { border-bottom: 1px solid var(--line); padding: 12px 0; }
    .filters summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
    .filters summary::-webkit-details-marker { display: none; }
    .bagpage img, .bagpage .ph { width: 120px; height: 120px; object-fit: cover; }
    .pdp-gallery .ph, .pdp-gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .pdp-gallery .ph:first-child, .pdp-gallery img:first-child { grid-column: 1 / -1; aspect-ratio: 1.05; }
    .cat .ph { position: absolute; inset: 0; }
    .ph {
      width: 100%; height: 100%;
      display: grid; place-items: end start;
      padding: 16px; color: #fff; font-size: 18px; letter-spacing: -0.03em;
    }
    .filters label {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; padding: 5px 0; color: #111;
    }
    .filters input[type=checkbox] { accent-color: #111; width: 16px; height: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
    .chip {
      border: 1px solid var(--line); background: #fff; height: 36px; padding: 0 12px; border-radius: 99px; font-size: 13px;
    }
    .chip.on { background: #111; color: #fff; border-color: #111; }

    .sizegrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 8px 0 24px;
    }
    .size {
      border: 1px solid var(--line);
      min-height: 72px;
      padding: 8px;
      display: flex; flex-direction: column; justify-content: space-between;
      background: #fff;
    }
    .size.off { color: var(--mute); background: var(--mist); }
    .sizegrid.compact { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
    .sizegrid.compact .size { min-height: 56px; padding: 6px; }
    .ops-thumb { width: 48px; height: 48px; overflow: hidden; background: #eee; }
    .ops-thumb img, .ops-thumb .ph { width: 48px; height: 48px; object-fit: cover; display: block; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .media-cell { display: block; border: 1px solid var(--line); padding: 8px; font-size: 12px; cursor: pointer; }
    .media-cell.on { outline: 2px solid #111; }
    .media-cell img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; margin: 6px 0; }
    .media-cell span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .size input {
      width: 100%; border: 0; outline: none; font-size: 18px; background: transparent;
    }

    table.data {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table.data th {
      text-align: left; font-weight: 500; color: var(--mute);
      border-bottom: 1px solid var(--line); padding: 12px 8px;
    }
    table.data td {
      border-bottom: 1px solid var(--line); padding: 14px 8px; vertical-align: middle;
    }
    table.data tr:hover td { background: #fafafa; }

    .ops {
      min-height: 100%;
    }
    .side {
      border-right: 1px solid var(--line);
      padding: 22px 10px 40px;
      position: fixed;
      top: 0; left: 0;
      width: 232px;
      height: 100vh;
      overflow: auto;
      font-size: 13.5px;
      background: #fff;
      z-index: 40;
    }
    .side .logo { margin: 4px 10px 20px; }
    .side a {
      display: block; padding: 6px 12px; font-size: 13.5px; border-radius: 6px;
    }
    .side a.active, .side a:hover { background: var(--mist); }
    .side .g { color: var(--mute); font-size: 12px; margin: 18px 12px 6px; }
    .main { padding: 32px 40px 80px; margin-left: 232px; }
    .hrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .hrow h1 { font-size: 32px; font-weight: 400; letter-spacing: -0.03em; }
    .hrow p { color: var(--mute); margin-top: 6px; }

    .field { display: block; margin: 0 0 24px; }
    .field span { display: block; font-size: 13px; color: var(--mute); margin-bottom: 8px; }
    .field input, .field select, .field textarea {
      width: 100%; height: 48px; border: 0; border-bottom: 1px solid #111;
      background: transparent; outline: none; font-size: 16px;
    }
    .field textarea { height: 96px; padding: 8px 0; resize: vertical; }
    .field + .btn, .stack + .btn { margin-top: 8px; }
    .section-block { margin-top: 56px; padding-top: 8px; }
    .section-block h2 { font-size: 22px; font-weight: 400; margin: 0 0 20px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 20px 24px;
      align-items: end;
      margin-top: 28px;
    }
    .form-grid .field { margin: 0; }
    .row .field { flex: 1; min-width: 200px; margin-bottom: 0; }

    .login {
      height: 100%;
      max-height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
    }
    .login-visual { background: #111; position: relative; overflow: hidden; min-height: 0; }
    .login-visual img { width: 100%; height: 100%; object-fit: cover; opacity: .88; }
    .login-visual .cap {
      position: absolute; left: 48px; bottom: 48px; color: #fff;
      font-size: 40px; letter-spacing: -0.04em; max-width: 420px; font-weight: 400;
    }
    .login-form { display: grid; place-items: center; padding: 40px 48px; min-height: 0; overflow: hidden; }
    .login-form .box { width: min(420px, 100%); }
    .login-form .field { margin-bottom: 36px; }
    .login-form .btn.block { margin-top: 8px; }
    @media (max-height: 700px) {
      .login-form .field { margin-bottom: 18px; }
      .login-form .btn { margin-top: 8px; }
      .accounts { margin-top: 20px; }
      .login-visual .cap { font-size: 28px; bottom: 24px; }
    }
    .accounts { margin-top: 36px; font-size: 13px; color: var(--mute); line-height: 1.8; }
    .accounts button {
      border: 0; background: transparent; color: #111; text-decoration: underline; padding: 0;
    }

    .bagpage { width: min(1100px, calc(100% - 48px)); margin: 0 auto; padding: 40px 0 100px; }
    .qty {
      display: inline-flex; border-bottom: 1px solid #111; height: 36px; align-items: center;
    }
    .qty button { width: 28px; border: 0; background: transparent; font-size: 18px; }
    .qty input { width: 40px; border: 0; text-align: center; outline: none; }

    .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .tabs a, .tabs button {
      border: 0; background: transparent; padding: 12px 0; font-size: 16px; color: var(--mute);
    }
    .tabs .on { color: #111; box-shadow: inset 0 -2px 0 #111; }

    .toastwrap {
      position: fixed; right: 24px; bottom: 24px; z-index: 80;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: #111; color: #fff; padding: 14px 18px; min-width: 240px;
      font-size: 14px;
    }
    .toast.err { background: var(--danger); }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 70;
      display: grid; place-items: center; padding: 24px;
    }
    .sheet {
      background: #fff; width: min(720px, 100%); max-height: 86vh; overflow: auto;
      padding: 32px;
    }
    .empty { padding: 80px 0; text-align: center; color: var(--mute); }
    .empty h3 { color: #111; font-weight: 400; font-size: 28px; margin-bottom: 8px; }

    .statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 28px; }
    .stat { background: #fff; padding: 18px 16px; }
    .stat b { font-size: 28px; font-weight: 400; letter-spacing: -0.04em; display: block; }
    .stat span { color: var(--mute); font-size: 13px; }

    .fairband {
      margin: 12px auto 0; width: min(1440px, calc(100% - 72px));
      min-height: 280px; position: relative; overflow: hidden; background: #111; color: #fff;
    }
    .fairband img { width: 100%; height: 280px; object-fit: cover; opacity: .8; }
    .fairband .copy { position: absolute; left: 40px; bottom: 36px; }
    .fairband h2 { font-size: 36px; font-weight: 400; letter-spacing: -0.03em; margin-bottom: 16px; }

    .bottom {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      border-top: 1px solid var(--line);
      grid-template-columns: repeat(5, 1fr);
      height: 58px; z-index: 50;
    }
    .bottom a { display: grid; place-items: center; font-size: 11px; color: var(--mute); gap: 2px; }
    .bottom a.on { color: #111; }

    .notice { background: var(--mist); padding: 8px 36px; font-size: 13px; display: flex; justify-content: space-between; height: 36px; align-items: center; }
    .kvs { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; font-size: 14px; }
    .kvs i { color: var(--mute); font-style: normal; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
    .muted { color: var(--mute); }
    .right { text-align: right; }
    .grow { flex: 1; }
    hr.line { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--mist); padding: 12px; white-space: pre-wrap; }
    .perm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .perm label { border: 1px solid var(--line); padding: 10px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }

    .chart {
      display: flex; align-items: flex-end; gap: 10px; height: 180px;
      border-bottom: 1px solid var(--line); padding: 0 8px;
    }
    .chart b {
      flex: 1; background: #111; display: block;
      font-weight: 400; color: transparent;
    }

    @media (max-width: 960px) {
      .top { grid-template-columns: auto 1fr auto; padding: 0 16px; }
      .nav, .searchbox { display: none; }
      .wrap, .fairband { width: calc(100% - 32px); }
      .hero .copy { left: 20px; bottom: 28px; }
      .cats, .grid, .plp-grid { grid-template-columns: 1fr 1fr; }
      .split, .pdp, .login, .ops, .plp, .pdp-media { grid-template-columns: 1fr; }
      .shop-teams { flex-direction: column; align-items: flex-start; }
      .pdp-thumbs { flex-direction: row; }
      .pdp-hero, .pdp-hero img { min-height: 320px; }
      .side { display: none; }
      .ops.show-side .side { display: block; position: fixed; inset: 0 auto 0 0; width: 80%; background: #fff; z-index: 50; }
      .pdp-buy { padding: 24px 16px 120px; position: static; }
      .pdp-gallery { grid-template-columns: 1fr; }
      .bottom { display: grid; }
      .page { padding-bottom: 70px; }
      .main { padding: 20px 16px 100px; margin-left: 0; }
      .statrow { grid-template-columns: 1fr 1fr; }
      .login { grid-template-rows: 34% 1fr; height: 100%; max-height: 100dvh; }
      .login-visual { min-height: 0; }
      .login-visual .cap { font-size: 22px; left: 20px; bottom: 16px; }
      .login-form { padding: 24px 20px; align-content: center; }
      .form-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
    @media print {
      .top, .bottom, .btn, .side { display: none !important; }
      body { background: #fff; }
    }
  </style>
</head>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script type="text/babel" src="js/ui.jsx"></script>
  <script type="text/babel" src="js/mall.jsx"></script>
  <script type="text/babel" src="js/ops.jsx"></script>
  <script type="text/babel" src="js/app.jsx"></script>
